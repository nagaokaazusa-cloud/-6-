<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarch ノコンギク</title>
<style>:root{color-scheme:light}html{padding:0}body{margin:0}</style>
<style>
/* Layout: real-phone look. System fonts (SF / Hiragino), iOS status bar + Dynamic Island + home indicator, Google-style search UI. Frame only on wide screens. */
:root {
  --bg: #e9eaee;
  --screen: #ffffff;
  --fg: #202124;
  --muted: #5f6368;
  --line: #dadce0;
  --link: #1a0dab;
  --accent: #4e6bd0;
  --chip: #f1f3f4;
  --field: #ffffff;
  --shadow: 0 1px 6px rgba(32, 33, 36, .28);
  --frame: #111214;
  --sky: #e6f3fb; --sky-line: #cfe6f4;
  --l1: #c95c4f; --l2: #dba557; --l3: #62a08f; --l4: #4e6bd0; --l5: #8a5cc9; --ico: #5f6368; --hint: #8e8e99; --btn-shadow: 0 2px 14px rgba(0,0,0,.12);
  --g-blue: #4285f4; --g-red: #ea4335; --g-yellow: #fbbc05; --g-green: #34a853;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-logo: "Product Sans", "Google Sans", Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050505; --screen: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
    --link: #8ab4f8; --accent: #93a6f0; --chip: #303134; --field: #303134; --shadow: none;
    --g-blue: #8ab4f8; --g-red: #f28b82; --g-yellow: #fdd663; --g-green: #81c995; --l1: #e0786b; --l2: #e8b76f; --l3: #7dbcab; --l4: #93a6f0; --l5: #b08be6; --ico: #bdc1c6; --hint: #9aa0a6; --btn-shadow: none; --sky: #1f3342; --sky-line: #2f4a5e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050505; --screen: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
  --link: #8ab4f8; --accent: #93a6f0; --chip: #303134; --field: #303134; --shadow: none;
  --g-blue: #8ab4f8; --g-red: #f28b82; --g-yellow: #fdd663; --g-green: #81c995; --l1: #e0786b; --l2: #e8b76f; --l3: #7dbcab; --l4: #93a6f0; --l5: #b08be6; --ico: #bdc1c6; --hint: #9aa0a6; --btn-shadow: none; --sky: #1f3342; --sky-line: #2f4a5e; color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
}

.phone {
  width: 100%; height: 100%;
  background: var(--screen);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}
@media (min-width: 560px) {
  body { padding: 20px; }
  .phone {
    width: 393px; height: 852px; zoom: 0.7; flex: none;
    border-radius: 55px;
    box-shadow: 0 0 0 3px #3a3c42, 0 0 0 12px var(--frame), 0 30px 70px rgba(0,0,0,.35);
  }
  .island { display: block; }
}

/* status bar */
.status {
  flex: none; height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 34px 0 40px;
  font-size: 16px; font-weight: 600; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
}
.status .r { display: flex; align-items: center; gap: 6px; }
.status svg { height: 12px; width: auto; fill: currentColor; }
.island {
  display: none;
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 20;
}
@media (max-width: 559px) {
  /* スマホでは画面全体を使う（上下を切らない） */
  html, body { height: auto; min-height: 100%; }
  body { display: block; padding: 0; }
  .phone { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; }
  .status { padding: env(safe-area-inset-top, 0px) 20px 0; height: auto; min-height: 44px; }
}

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view[hidden] { display: none !important; }

/* ---------- search view ---------- */
.search-view { padding: 0; }
.stabs { flex: none; display: flex; align-items: center; padding: 6px 20px 0 22px; height: 44px; }
.stabs .t { padding: 0 0 8px; margin-right: 22px; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; align-self: flex-end; height: 34px; display: flex; align-items: center; }
.stabs .t.on { color: var(--accent); font-weight: 500; border-bottom-color: var(--accent); border-radius: 0; }
.stabs .sp { flex: 1; }
.stabs .ic { width: 24px; height: 24px; fill: var(--ico); margin-left: 22px; }
.search-main { flex: 1; min-height: 0; padding: 0 max(25px, env(safe-area-inset-right, 0px)) 0 max(25px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; justify-content: center; padding-bottom: 24%; }
.logo {
  margin: 0 0 26px; text-align: center;
  font-weight: 800; font-size: 58px; line-height: 1; letter-spacing: -.02em;
}
.logo .c1 { color: var(--l1); } .logo .c2 { color: var(--l2); } .logo .c3 { color: var(--l3); }
.logo .c4 { color: var(--l4); } .logo .c5 { color: var(--l5); }

.bar {
  display: flex; align-items: center;
  height: 52px; padding: 0 14px 0 16px; gap: 12px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 26px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.bar:focus-within { border-color: var(--accent); }
.bar .sub, .bar .mic { flex: none; display: grid; place-items: center; border: 0; background: transparent; padding: 0; cursor: pointer; }
.bar .sub svg { width: 22px; height: 22px; fill: var(--ico); }
.bar .mic svg { width: 22px; height: 22px; fill: var(--accent); }
.bar input {
  flex: 1; min-width: 0; height: 100%;
  border: 0; outline: 0; background: transparent;
  color: var(--fg); font: inherit; font-size: 16px;
  caret-color: var(--accent);
  -webkit-appearance: none; appearance: none;
}
.bar input::placeholder { color: var(--hint); opacity: 1; }
.bar input::-webkit-search-cancel-button { display: none; }
.notice { min-height: 1.5em; margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
.shortcuts { margin-top: 22px; display: flex; justify-content: space-between; padding: 0 4px; }
.sc { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg); width: 64px; }
.sc i { width: 56px; height: 56px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; }
.sc svg { width: 28px; height: 28px; }
.sc-c { margin-top: 0; }
.btn:focus-visible, .back:focus-visible, .bar button:focus-visible, .bb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* browser bottom bar */
.bbar { position: absolute; left: 0; right: 0; bottom: 24px; z-index: 6; display: flex; gap: 10px; padding: 0 18px; align-items: center; }
.bb { height: 48px; border: 0; border-radius: 24px; background: var(--field); box-shadow: var(--btn-shadow); color: var(--fg); display: grid; place-items: center; cursor: default; padding: 0; font: inherit; }
.bb.round { width: 48px; flex: none; }
.bb.url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; }
.bb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.bb.url span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb.round.dis { color: var(--muted); }
@media (max-width: 559px) { .bbar { display: none; } }
@media (min-width: 560px) { .article { padding-bottom: 120px; } }

/* ---------- result view ---------- */
.result-view { overflow-y: auto; overscroll-behavior: contain; }
.topbar {
  position: sticky; top: 0; z-index: 2; flex: none;
  display: flex; align-items: center; gap: 4px;
  padding: 4px 12px 8px 4px;
  background: var(--screen);
}
.back {
  flex: none; display: grid; place-items: center;
  width: 44px; height: 44px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 50%;
}
.back svg { width: 24px; height: 24px; fill: currentColor; }
.mini {
  flex: 1; min-width: 0; height: 40px;
  display: flex; align-items: center; padding: 0 14px;
  background: var(--field); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tabs {
  flex: none; display: flex; gap: 16px; padding: 0 18px; scrollbar-width: none;
  border-bottom: 1px solid var(--line);
  font-size: 14px; color: var(--muted); overflow-x: auto; white-space: nowrap;
}
.tabs span { padding: 10px 0 9px; border-bottom: 3px solid transparent; }
.tabs .on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

.article { padding: 20px max(20px, env(safe-area-inset-right, 0px)) 48px max(20px, env(safe-area-inset-left, 0px)); }
.name { margin: 0; font-size: 28px; font-weight: 400; line-height: 1.3; }
.kind { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.gallery { margin: 16px 0 0; display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: auto auto; gap: 4px; border-radius: 12px; overflow: hidden; }
.gallery figure { margin: 0; min-width: 0; min-height: 0; background: var(--chip); overflow: hidden; position: relative; }
.gallery img { display: block; width: 100%; height: 100%; object-fit: cover; }
.g1 { grid-row: 1 / span 2; grid-column: 1; }
.g1 img { position: absolute; inset: 0; object-position: 38% 50%; }
.g2, .g3 { grid-column: 2; aspect-ratio: 4 / 3; }
.photo { margin: 16px 0 0; border-radius: 12px; overflow: hidden; background: var(--chip); aspect-ratio: 4 / 3; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.sci { font-style: italic; overflow-wrap: anywhere; }
.h2 { margin: 24px 0 4px; font-size: 18px; font-weight: 500; line-height: 1.4; }
dl { margin: 0; }
.row { display: grid; grid-template-columns: 3em 1fr; column-gap: 14px; padding: 9px 0; font-size: 15px; line-height: 1.65; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
dt { color: var(--muted); }
dd { margin: 0; min-width: 0; }

.home {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px; background: var(--fg); opacity: .9; z-index: 20; pointer-events: none;
}
@media (max-width: 559px) {
  .home { display: none; }
  .search-main { padding-bottom: 16%; }
  .article { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
}
</style>

</head>

<main class="phone" aria-label="スマホ画面">
  <div class="island" aria-hidden="true"></div>
  <div class="status" aria-hidden="true">
    <span></span>
    <span class="r">
    </span>
  </div>

  <!-- 検索画面 -->
  <section class="view search-view" id="v-search">
    <div class="stabs">
      <span class="t on">すべて</span><span class="t">画像</span><span class="sp"></span>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.4 2.4 0 0 0 2.3-1.8H9.7A2.4 2.4 0 0 0 12 22Zm7-5.6-1.6-1.6V10c0-3-1.7-5.400-4.400-6.100V3.200a1.400 1.400 0 0 0-2.800 0v.700C7.300 4.600 5.600 7 5.600 10v4.800L4 16.400V18h16v-1.600Zm-3.200-.4H8.200v-6c0-2.300 1.500-4.200 3.800-4.200s3.800 1.900 3.800 4.200v6Z"/></svg>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.600"/><rect x="13" y="3" width="8" height="8" rx="2.600"/><rect x="3" y="13" width="8" height="8" rx="2.600"/><rect x="13" y="13" width="8" height="8" rx="2.600"/></svg>
    </div>
    <div class="search-main">
      <h1 class="logo" aria-label="Sarch"><span class="c1">S</span><span class="c2">a</span><span class="c3">r</span><span class="c4">c</span><span class="c5">h</span></h1>
      <form id="form" role="search" autocomplete="off">
        <div class="bar">
          <button class="sub" type="submit" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.500 14h-.8l-.3-.3A6.500 6.500 0 1 0 14 15.500l.3.3v.8l5 5 1.500-1.500-5-5Zm-6 0a4.500 4.500 0 1 1 0-9 4.500 4.500 0 0 1 0 9Z"/></svg></button>
          <input id="q" name="q" type="search" enterkeyhint="search" inputmode="url" placeholder="検索またはURLを入力" aria-label="検索" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="mic" type="button" aria-label="音声入力"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.500 3.500 0 0 0 3.500-3.500v-6a3.500 3.500 0 0 0-7 0v6A3.500 3.500 0 0 0 12 15Zm6-3.500h-1.800a4.200 4.200 0 0 1-8.400 0H6a6 6 0 0 0 5 5.900V21h2v-3.600a6 6 0 0 0 5-5.900Z"/></svg></button>
        </div>
      </form>
      <p class="notice" id="notice" role="status"></p>
      <div class="shortcuts">
        <div class="sc"><i><svg viewBox="0 0 32 32"><g stroke="#e8a94a" stroke-width="2" stroke-linecap="round"><path d="M9 3v2M3 9h2M15 9h2M4.500 4.500 6 6M13.500 4.500 12 6"/></g><circle cx="9.500" cy="9.800" r="4" fill="#e8a94a"/><path d="M12 25h12a4.500 4.500 0 0 0 .6-8.900A6 6 0 0 0 13 17.200 3.900 3.900 0 0 0 12 25Z" fill="var(--chip)" stroke="#8d9199" stroke-width="2" stroke-linejoin="round"/></svg></i>天気</div>
        <div class="sc"><i><svg viewBox="0 0 32 32" fill="none" stroke="#6b7078" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 6h18v20H7a2 2 0 0 1-2-2V6Z"/><path d="M23 11h4v13a2 2 0 0 1-4 0"/><rect x="8.500" y="9.500" width="6" height="5" fill="#4e6bd0" stroke="none"/><path d="M17 10h3M17 14h3M9 18.500h11M9 22h11"/></svg></i>ニュース</div>
        <div class="sc"><i><svg viewBox="0 0 32 32" fill="none" stroke="#62a08f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="18" height="19" rx="4"/><rect x="10.500" y="7.500" width="11" height="5" rx="1.200" fill="#62a08f"/><path d="M12 18h.1M20 18h.1M11 23l-3 5M21 23l3 5M12 26h8"/></svg></i>乗換</div>
        <div class="sc"><i><svg viewBox="0 0 32 32"><rect x="3" y="3" width="15" height="15" rx="3" fill="#4e6bd0"/><text x="10.500" y="14.500" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="sans-serif">文</text><rect x="14" y="14" width="15" height="15" rx="3" fill="var(--screen)" stroke="#5f6368" stroke-width="2"/><text x="21.500" y="25.500" font-size="11" font-weight="700" fill="#3c4043" text-anchor="middle" font-family="sans-serif">A</text></svg></i>翻訳</div>
      </div>
    </div>
  </section>

  <!-- 検索結果ページ -->
  <section class="view result-view" id="v-result" hidden>
    <div class="topbar">
      <button class="back" id="back" aria-label="戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.800l5.600-5.600L12 4l-8 8 8 8 1.400-1.400L7.800 13H20v-2Z"/></svg></button>
      <div class="mini" id="miniq">ノコンギク</div>
    </div>
    <div class="tabs"><span class="on">すべて</span><span>画像</span><span>動画</span><span>ニュース</span><span>地図</span><span>ショッピング</span><span>ニュース</span></div>
    <article class="article">

      <h3 class="h2">概要</h3>
      <dl>
        <div class="row"><dt>和名</dt><dd>ノコンギク（野紺菊）</dd></div>
        <div class="row"><dt>科名</dt><dd>キク科</dd></div>
        <div class="row"><dt>属名</dt><dd>シオン属</dd></div>
        <div class="row"><dt>花期</dt><dd>8月～11月ごろ</dd></div>
        <div class="row"><dt>特徴</dt><dd>多年草。日本の山野や道端、土手などで秋に咲く野菊の仲間。淡い青紫色の花びらと黄色い中心の組み合わせが素朴で、秋の野原を彩る。</dd></div>
        <div class="row"><dt>学名</dt><dd class="sci">Aster microcephalus var. ovatus</dd></div>
      </dl>

<script>
(function () {
  var form = document.getElementById('form');
  var q = document.getElementById('q');
  var notice = document.getElementById('notice');
  var vSearch = document.getElementById('v-search');
  var vResult = document.getElementById('v-result');
  var miniq = document.getElementById('miniq');

  function norm(s) {
    return s.normalize('NFKC').replace(/\s+/g, '')
      .replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 96); });
  }
  var HITS = ['ノコンギク', '野紺菊'];

  function show(view) {
    vSearch.hidden = view !== 'search';
    vResult.hidden = view !== 'result';
    if (view === 'result') vResult.scrollTop = 0;
  }
  var TARGET = 'ノコンギク';
  var last = 0;
  function fill(len) {
    q.value = TARGET.slice(0, Math.max(0, Math.min(len, TARGET.length)));
    var e = last = q.value.length;
    try { q.setSelectionRange(e, e); } catch (x) {}
  }
  function isEnter(e) { return e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter' || e.keyCode === 13; }

  // 検索：何度呼ばれても、結果ページへ移動するだけ
  function doSearch() {
    if (!vResult.hidden) return;
    var raw = q.value.trim(), n = norm(raw);
    if (!n) { q.focus(); return; }
    var prefix = n.length >= 2 && TARGET.indexOf(n) === 0;
    if (HITS.indexOf(n) !== -1 || prefix) {
      notice.textContent = '';
      miniq.textContent = TARGET;
      q.blur();
      show('result');
    } else {
      notice.textContent = '「' + raw + '」に一致する情報は見つかりませんでした';
    }
  }
  function typeOne() { notice.textContent = ''; fill(last + 1); }

  // エンター：どの入力方式でも検索（変換中・仮想キーボード・テンキーを含む）
  form.addEventListener('submit', function (e) { e.preventDefault(); doSearch(); });
  document.addEventListener('keydown', function (e) {
    if (vSearch.hidden) return;
    if (isEnter(e)) { e.preventDefault(); doSearch(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    // どのキーを押しても、フォーカスの位置に関係なく1文字ずつ入力
    if (e.key && e.key.length === 1) { e.preventDefault(); q.focus(); typeOne(); }
  });
  document.addEventListener('keyup', function (e) { if (!vSearch.hidden && isEnter(e)) doSearch(); });
  q.addEventListener('beforeinput', function (e) {
    var t = e.inputType;
    if (t === 'insertLineBreak' || t === 'insertParagraph' || (e.data && /[\r\n]/.test(e.data))) {
      e.preventDefault(); doSearch();
    } else if (t === 'insertText' && e.cancelable) {
      e.preventDefault(); typeOne();
    }
  });
  q.addEventListener('input', function () {
    notice.textContent = '';
    // 1回の入力で増えるのは常に1文字まで
    fill(Math.min(q.value.length, last + 1));
  });
  q.addEventListener('compositionend', function () { fill(Math.min(q.value.length, last + 1)); });

  // 画面のどこをタップ・クリックしても、検索欄に入力できる状態にする
  vSearch.addEventListener('click', function (e) {
    if (e.target.closest('button, a')) return;
    q.focus();
  });
  function toSearch() { show('search'); fill(0); q.focus(); }
  document.getElementById('back').addEventListener('click', toSearch);
  document.getElementById('bb-back').addEventListener('click', function () { if (!vResult.hidden) toSearch(); });

})();
</script>
